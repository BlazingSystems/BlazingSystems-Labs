name: BlazeFM Android

on:
  push:
    branches: [ main, blazefm-v1.2.0, blazefm-v1.2.0 ]
    paths:
      - 'android/blazefm/**'
      - '.github/workflows/blazefm-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build, shrink and lint BlazeFM
        working-directory: android/blazefm
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug :app:assembleRelease :app:lint

      - name: Prepare APKs and checksums
        run: |
          mkdir -p dist
          cp android/blazefm/app/build/outputs/apk/debug/app-debug.apk dist/BlazeFM-v1.2.0-preview.apk
          cp android/blazefm/app/build/outputs/apk/release/app-release-unsigned.apk dist/BlazeFM-v1.2.0-release-unsigned.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlazeFM-v1.2.0-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub prerelease from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="blazefm-v1.2.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BlazeFM v1.2.0 Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Installable debug-signed preview plus unsigned/minified release APK. Production signing key is intentionally not stored in this public repository."
