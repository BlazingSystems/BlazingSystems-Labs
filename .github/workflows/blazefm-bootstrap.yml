name: BlazeFM v1.1.0 Bootstrap

on:
  push:
    branches: [ blazefm-v1.1.0 ]
    paths:
      - '.github/blazefm-source/**'
      - '.github/workflows/blazefm-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-expand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/blazefm-source/part_* | base64 -d > /tmp/blazefm-source.tar.gz
          echo "bc4d812f24d31bc6bb05933faefba578ee10c8ce1c18d24db0dfec5d97d4c357  /tmp/blazefm-source.tar.gz" | sha256sum -c -
          rm -rf android/blazefm
          mkdir -p android/blazefm
          tar -xzf /tmp/blazefm-source.tar.gz -C android/blazefm
          cat >> android/blazefm/app/proguard-rules.pro <<'EOF'
          -dontwarn com.sun.jna.**
          -dontwarn org.newsclub.net.unix.**
          -dontwarn javax.security.auth.**
          -dontwarn org.ietf.jgss.**
          -dontwarn org.apache.logging.log4j.**
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/blazefm")
          f = root / "app/src/main/java/com/blazefm/blazesystems/FileEngine.java"
          s = f.read_text()
          replacements = {
              "sizes.computeIfAbsent(f.length(),k->new ArrayList<>()).add(f);": "bucket(sizes,f.length()).add(f);",
              "quick.computeIfAbsent(k,x->new ArrayList<>()).add(f);": "bucket(quick,k).add(f);",
              "full.computeIfAbsent(h,x->new ArrayList<>()).add(f);": "bucket(full,h).add(f);",
              "Collections.sort(pairs,Comparator.comparingInt(x->x.distance));": "Collections.sort(pairs,(a,b)->a.distance<b.distance?-1:(a.distance==b.distance?0:1));",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit("compatibility patch marker missing: " + old)
              s = s.replace(old, new)
          helper = "\n    private static <K,V> List<V> bucket(Map<K,List<V>> map,K key){List<V> v=map.get(key);if(v==null){v=new ArrayList<V>();map.put(key,v);}return v;}\n"
          pos = s.rfind("}")
          if pos < 0:
              raise SystemExit("FileEngine class close not found")
          s = s[:pos] + helper + s[pos:]
          f.write_text(s)

          styles = root / "app/src/main/res/values/styles.xml"
          s = styles.read_text()
          marker = '<item name="android:windowLightStatusBar">false</item>'
          if marker not in s:
              raise SystemExit("windowLightStatusBar marker missing")
          styles.write_text(s.replace(marker, ""))

          cloud = root / "app/src/main/java/com/blazefm/blazesystems/CloudActivity.java"
          s = cloud.read_text()
          old = 'int flags=data.getFlags()&(Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION);try{getContentResolver().takePersistableUriPermission(u,flags);}catch(Exception ignored){}'
          new = 'try{getContentResolver().takePersistableUriPermission(u,Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION);}catch(Exception first){try{getContentResolver().takePersistableUriPermission(u,Intent.FLAG_GRANT_READ_URI_PERMISSION);}catch(Exception ignored){}}'
          if old not in s:
              raise SystemExit("CloudActivity persistable-permission marker missing")
          cloud.write_text(s.replace(old, new))

          manifest = root / "app/src/main/AndroidManifest.xml"
          s = manifest.read_text()
          marker = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>'
          if marker not in s:
              raise SystemExit("QUERY_ALL_PACKAGES marker missing")
          manifest.write_text(s.replace(marker, ""))
          PY
          echo '--- candidate app/build.gradle ---'
          cat android/blazefm/app/build.gradle
          echo '--- candidate Java files ---'
          find android/blazefm/app/src/main/java -type f -maxdepth 10 -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate BlazeFM candidate and expose lint failures
        working-directory: android/blazefm
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace clean :app:assembleDebug :app:assembleRelease :app:lintDebug
          code=$?
          echo '--- lint text report ---'
          report='app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt'
          if [ -f "$report" ]; then cat "$report"; else echo 'lint report not generated'; fi
          exit $code

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/blazefm-source
          rm -f .github/workflows/blazefm-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/blazefm .github
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Upgrade BlazeFM to v1.1.0 ES-style file manager"
          git push origin HEAD:blazefm-v1.1.0
