<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loumer Local AI Studio</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#e9edf5;font:14px system-ui}header{padding:18px;background:#121722;display:flex;justify-content:space-between}.wrap{display:grid;grid-template-columns:220px 1fr}nav,main{padding:14px}.tab,.go,input,textarea,select{font:inherit}.tab{width:100%;padding:11px;margin:3px;background:#171e2b;color:#ddd;border:1px solid #334;border-radius:7px}.active{background:#30415f}.card{max-width:900px;background:#121925;border:1px solid #273247;border-radius:12px;padding:16px}label{display:block;margin-top:10px}textarea,input,select{width:100%;padding:9px;background:#0b1019;color:white;border:1px solid #34415a;border-radius:6px}.go{margin-top:14px;padding:10px 18px;background:#e7c85b;border:0;border-radius:7px;color:#111;font-weight:bold}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.result{padding:12px;white-space:pre-wrap}.hint{color:#9ba8bc}</style></head><body><header><b>LOUMER LOCAL AI STUDIO — ENGINE BUILD</b><span id="status">Checking…</span></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const modes=[['text-image','TEXT-TO-IMAGE'],['image-image','IMAGE-TO-IMAGE'],['upscale','IMAGE UPSCALER'],['text-video','TEXT-TO-VIDEO'],['frames-video','FIRST / LAST FRAME'],['multi-ref','MULTI-REFERENCE'],['tts','TTS'],['settings','SETTINGS']];let active='text-image';
const $=x=>document.getElementById(x);function fileBox(id,multi=false){return `<label>${id==='image2'?'Last frame / second image':'Input image(s)'}</label><input id="${id}" type="file" accept="image/*" ${multi?'multiple':''}>`}
function draw(){nav.innerHTML=modes.map(x=>`<button class="tab ${active==x[0]?'active':''}" onclick="active='${x[0]}';draw()">${x[1]}</button>`).join('');if(active==='settings'){main.innerHTML=settings();loadSettings();return}let inputs='';if(['image-image','upscale','frames-video'].includes(active))inputs+=fileBox('image');if(active==='frames-video')inputs+=fileBox('image2');if(active==='multi-ref')inputs+=fileBox('images',true);main.innerHTML=`<h2>${modes.find(x=>x[0]==active)[1]}</h2><div class="card"><label>Prompt / text</label><textarea id="prompt" rows="5"></textarea><label>Negative prompt</label><textarea id="negative" rows="2"></textarea>${inputs}<div class="row"><div><label>Width</label><input id="width" value="512"></div><div><label>Height</label><input id="height" value="512"></div><div><label>Steps</label><input id="steps" value="12"></div><div><label>Seed</label><input id="seed" value="-1"></div></div><div class="row"><div><label>CFG</label><input id="cfg" value="7"></div><div><label>Strength</label><input id="strength" value="0.65"></div><div><label>Seconds</label><input id="seconds" value="4"></div><div><label>FPS</label><input id="fps" value="12"></div></div><button class="go" onclick="generate()">GENERATE</button><div id="res" class="result hint"></div></div>`}
function settings(){return `<h2>SETTINGS</h2><div class="card"><label>Stable Diffusion model folder</label><input id="sd_model"><label>Device</label><select id="device"><option value="auto">CPU / Auto-safe</option><option value="cuda">NVIDIA CUDA</option></select><label>Piper executable</label><input id="piper_exe"><label>Piper voice .onnx</label><input id="piper_voice"><button class="go" onclick="saveSettings()">SAVE</button><div id="res"></div></div>`}
async function b64(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}async function generate(){let d={mode:active,prompt:prompt.value,negative:negative.value,width:+width.value,height:+height.value,steps:+steps.value,seed:+seed.value,cfg:+cfg.value,strength:+strength.value,seconds:+seconds.value,fps:+fps.value};if($('image')?.files[0])d.image=await b64($('image').files[0]);if($('image2')?.files[0])d.image2=await b64($('image2').files[0]);if($('images'))d.images=await Promise.all([...$('images').files].map(b64));res.textContent='Working… On old CPUs this can take a very long time.';let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();res.innerHTML=j.ok?`Done: <a href="${j.url}" target="_blank">${j.file}</a>`:j.error}
async function loadSettings(){let j=await(await fetch('/api/status')).json();for(let k of ['sd_model','device','piper_exe','piper_voice'])if($(k))$(k).value=j.config[k]||''}async function saveSettings(){let d={};for(let k of ['sd_model','device','piper_exe','piper_voice'])d[k]=$(k).value;let j=await(await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})).json();res.textContent=j.ok?'Saved.':'Error'}fetch('/api/status').then(r=>r.json()).then(j=>status.textContent=`Server online • SD model ${j.sd_ready?'found':'missing'}`);draw();</script></body></html>
