<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local AI Studio Preview</title>
<style>
body{margin:0;background:#090e15;color:#edf4ff;font:14px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(850px,100%);background:#121b26;border:1px solid #29394d;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:260px 1fr;gap:14px}.panel{background:#0b131d;border:1px solid #26384c;border-radius:12px;padding:14px}label{display:block;color:#94a8bc;font-size:12px;margin:10px 0 4px}input,select,button{width:100%;box-sizing:border-box;padding:9px;border:1px solid #30445b;border-radius:8px;background:#09121b;color:#fff;font:inherit}button{background:#17416a;cursor:pointer}.canvas{min-height:320px;display:grid;place-items:center;text-align:center;color:#90a4b9;background:linear-gradient(135deg,#101c29,#0a1119)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="app"><h1>Local AI Studio</h1><p style="color:#94a8bc">Static portfolio preview. No model is loaded and no generation request leaves this page.</p><div class="grid">
<section class="panel"><label>Mode</label><select><option>Text to Image</option><option>Image to Image</option><option>Upscale</option></select><label>Prompt</label><input value="A compact electronics workbench"><label>Steps</label><input type="number" value="20"><button id="go">Simulate Generate</button></section>
<section class="panel canvas" id="out">Engine preview<br><small>The real project connects this interface to a localhost Python service.</small></section></div>
<script>go.onclick=()=>{out.innerHTML='Demo request queued locally.<br><small>No model or network service is used in this portfolio preview.</small>'}</script></main></body></html>
